services:
  - type: web
    name: fullstack-app
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build &&
      cp -r dist/* ../backend/static/
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT
    workingDir: .
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
