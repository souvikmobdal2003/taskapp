services:
  - type: web
    name: fullstack-app
    env: python
    buildCommand: |
      echo "=== Build Process Starting ===" &&
      echo "Current directory: $(pwd)" &&
      echo "Directory structure:" &&
      find . -maxdepth 2 -type d &&
      echo "=== Installing Python Dependencies ===" &&
      pip install -r backend/requirements.txt &&
      echo "=== Python dependencies installed ===" &&
      echo "=== Checking frontend directory ===" &&
      ls -la frontend/ &&
      echo "=== Starting Frontend Build ===" &&
      cd frontend &&
      echo "In frontend directory: $(pwd)" &&
      npm ci --production=false &&
      echo "=== Building React app ===" &&
      npm run build &&
      echo "=== Checking build output ===" &&
      ls -la dist/ &&
      echo "Build contents:" &&
      find dist/ -type f | head -20 &&
      echo "=== Returning to root and preparing static ===" &&
      cd .. &&
      echo "Back in: $(pwd)" &&
      echo "=== Removing old static directory ===" &&
      rm -rf backend/static &&
      echo "=== Creating new static directory ===" &&
      mkdir -p backend/static &&
      echo "Static directory created: $(ls -ld backend/static)" &&
      echo "=== Copying React build files ===" &&
      cp -rv frontend/dist/* backend/static/ &&
      echo "=== Verifying copy operation ===" &&
      echo "Static directory after copy:" &&
      ls -la backend/static/ &&
      echo "Checking for index.html specifically:" &&
      ls -la backend/static/index.html &&
      echo "=== Verifying file contents ===" &&
      head -n 5 backend/static/index.html &&
      echo "=== Build completed successfully ==="
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    workingDir: .
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: ""
